name: plug_dbt
version: 1.0.0
config-version: 2

profile: plug_dbt

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  plug_dbt:
    staging:
      +materialized: incremental
    intermediate:
      +materialized: view

seeds:
  plug_dbt:
    raw_marketplace_events:
      +quote_columns: false
      +column_types:
        source_record_id: varchar
        source_system: varchar
        source_batch_id: varchar
        schema_version: varchar
        synthetic_vin: varchar
        request_id: varchar
        source_updated_at: varchar
        ingested_at: varchar
        source_event_id: varchar
        offer_id: varchar
        auction_id: varchar
        event_sequence: varchar
        event_type: varchar
        event_at: varchar
        scheduled_close_at: varchar
        bid_id: varchar
        dealer_id: varchar
        transaction_id: varchar
        event_amount: varchar
        event_amount_unit: varchar
        currency_code: varchar
        amount_role: varchar
        auction_result_code: varchar
    raw_offer_events:
      +quote_columns: false
      +column_types:
        source_record_id: varchar
        source_system: varchar
        source_batch_id: varchar
        schema_version: varchar
        synthetic_vin: varchar
        request_id: varchar
        source_updated_at: varchar
        ingested_at: varchar
        source_event_id: varchar
        offer_id: varchar
        event_type: varchar
        event_sequence: varchar
        offer_version: varchar
        event_at: varchar
        reason_code: varchar
        pricing_evaluation_id: varchar
        feature_cutoff_at: varchar
        pricing_evaluated_at: varchar
        pricing_model_version: varchar
        pricing_policy_version: varchar
        assessment_id_used: varchar
        assessment_version_used: varchar
        predicted_wholesale_value_amount: varchar
        net_policy_adjustment_amount: varchar
        seller_offer_amount: varchar
        pricing_amount_unit: varchar
        pricing_currency_code: varchar
        expires_at: varchar
    raw_valuation_requests:
      +quote_columns: false
      +column_types:
        source_record_id: varchar
        source_system: varchar
        source_batch_id: varchar
        schema_version: varchar
        synthetic_vin: varchar
        request_id: varchar
        source_updated_at: varchar
        ingested_at: varchar
        seller_id: varchar
        submission_channel: varchar
        market_region: varchar
        odometer_value: varchar
        odometer_unit: varchar
        submitted_at: varchar
    raw_vehicle_assessments:
      +quote_columns: false
      +column_types:
        source_record_id: varchar
        source_system: varchar
        source_batch_id: varchar
        schema_version: varchar
        synthetic_vin: varchar
        request_id: varchar
        source_updated_at: varchar
        ingested_at: varchar
        assessment_id: varchar
        assessment_version: varchar
        assessment_status: varchar
        assessment_method_version: varchar
        vehicle_model_family: varchar
        vehicle_segment: varchar
        model_year: varchar
        assessed_odometer_value: varchar
        assessed_odometer_unit: varchar
        battery_soh_value: varchar
        battery_soh_unit: varchar
        condition_grade: varchar
        observed_at: varchar
        assessment_completed_at: varchar
        available_to_model_at: varchar
