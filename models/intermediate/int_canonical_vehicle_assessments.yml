version: 2

models:
  - name: int_canonical_vehicle_assessments
    description: >
      Contains accepted assessment replay survivors only. The model preserves
      each supported assessment version as physical source evidence with raw,
      parsed, numeric, normalized, and warning fields; it does not select the
      version used by a request-level lifecycle.
    columns:
      - name: assessed_odometer_kilometers
        description: Accepted usable assessment odometer normalized exactly to kilometers.
        tests:
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
      - name: assessed_odometer_miles
        description: Accepted usable assessment odometer normalized exactly to miles.
        tests:
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
      - name: assessed_odometer_unit
        description: Raw unit governing the accepted usable assessment odometer.
        tests:
          - accepted_values:
              arguments:
                values: [mi, km]
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
      - name: assessed_odometer_unit_normalized
        description: True when kilometer input required conversion to miles.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: assessed_odometer_value
        description: Raw positive-integer odometer text on accepted usable assessments.
        tests:
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
      - name: assessed_odometer_value_numeric
        description: Exact numeric interpretation of the accepted raw assessment odometer.
        tests:
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
      - name: assessment_completed_at
        description: Raw completion timestamp of the accepted supported assessment.
        tests:
          - not_null
      - name: assessment_completed_at_ts
        description: Parsed completion instant of the accepted supported assessment.
        tests:
          - not_null
      - name: assessment_id
        description: Assessment attempt identifier shared by supported versions.
        tests:
          - not_null
      - name: assessment_method_version
        description: Fictional method version used by the accepted assessment.
        tests:
          - accepted_values:
              arguments:
                values: [method_baseline, method_current]
      - name: assessment_status
        description: Accepted supported result distinguishing usable evidence from failure.
        tests:
          - accepted_values:
              arguments:
                values: [usable, failed]
      - name: assessment_version
        description: Raw supported assessment-version text.
        tests:
          - accepted_values:
              arguments:
                values: ["1", "2"]
      - name: assessment_version_numeric
        description: Exact integer interpretation of the accepted assessment version.
        tests:
          - accepted_range:
              arguments:
                inclusive: true
                min_value: 1
                max_value: 2
      - name: available_to_model_at
        description: Raw timestamp when the accepted assessment result reached model serving.
        tests:
          - not_null
      - name: available_to_model_at_ts
        description: Parsed model-serving availability instant.
        tests:
          - not_null
      - name: battery_soh_percent
        description: Exact battery state-of-health percentage on accepted usable assessments.
        tests:
          - accepted_range:
              arguments:
                inclusive: true
                min_value: 50.0
                max_value: 100.0
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
      - name: battery_soh_unit
        description: Percent unit accompanying accepted usable battery state of health.
        tests:
          - accepted_values:
              arguments:
                values: [percent]
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
      - name: battery_soh_value
        description: Raw one-decimal battery state-of-health text on accepted usable rows.
        tests:
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
      - name: condition_grade
        description: Frozen condition classification on accepted usable assessments.
        tests:
          - accepted_values:
              arguments:
                values: [clean, average, rough]
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
      - name: delivery_sk
        description: Accepted physical delivery selected as the assessment-version survivor.
        tests:
          - not_null
          - unique
      - name: has_non_z_timestamp_representation
        description: True when accepted evidence uses an explicit offset instead of a trailing Z.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: ingested_at
        description: Raw arrival timestamp of the accepted assessment delivery.
        tests:
          - not_null
      - name: ingested_at_ts
        description: Parsed arrival instant of the accepted assessment delivery.
        tests:
          - not_null
      - name: model_year
        description: Raw model-year text on accepted usable assessments.
        tests:
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
      - name: model_year_numeric
        description: Exact accepted model year in the frozen 2012 through 2026 range.
        tests:
          - accepted_range:
              arguments:
                inclusive: true
                min_value: 2012
                max_value: 2026
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
      - name: observed_at
        description: Raw vehicle-observation timestamp on accepted usable assessments.
        tests:
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
      - name: observed_at_ts
        description: Parsed vehicle-observation instant on accepted usable assessments.
        tests:
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
      - name: request_id
        description: Canonical request foreign key for the accepted assessment version.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_canonical_valuation_requests')
                field: request_id
      - name: schema_version
        description: Supported lexical assessment schema version.
        tests:
          - accepted_values:
              arguments:
                values: ["1.0"]
      - name: source_batch_id
        description: Accepted delivery-batch lineage retained for auditability.
        tests:
          - not_null
      - name: source_record_id
        description: Source identifier of the accepted physical assessment delivery.
        tests:
          - not_null
      - name: source_system
        description: Fixed vehicle-assessment producer namespace.
        tests:
          - accepted_values:
              arguments:
                values: [vehicle_assessment]
      - name: source_updated_at
        description: Raw source-change timestamp of the accepted assessment delivery.
        tests:
          - not_null
      - name: source_updated_at_ts
        description: Parsed source-change instant of the accepted assessment delivery.
        tests:
          - not_null
      - name: synthetic_vin
        description: Synthetic vehicle key already reconciled to the canonical request.
        tests:
          - not_null
      - name: vehicle_model_family
        description: Frozen vehicle taxonomy value on accepted usable assessments.
        tests:
          - accepted_values:
              arguments:
                values:
                  - chevrolet_bolt_ev
                  - ford_f150_lightning
                  - ford_mustang_mach_e
                  - hyundai_ioniq_5
                  - nissan_leaf
                  - tesla_model_3
                  - tesla_model_y
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
      - name: vehicle_segment
        description: Frozen segment mapped from vehicle_model_family on accepted usable rows.
        tests:
          - accepted_values:
              arguments:
                values: [hatchback, sedan, crossover, pickup]
          - required_when:
              arguments:
                condition: "assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "assessment_status = 'failed'"
