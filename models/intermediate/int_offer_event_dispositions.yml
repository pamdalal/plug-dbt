version: 2

models:
  - name: int_offer_event_dispositions
    description: >
      Emits exactly one runtime-derived disposition per physical offer-event
      delivery. Supported rows replay-group by offer ID and event sequence,
      then enforce request/VIN identity and point-in-time availability of the
      referenced usable assessment for pricing-bearing events.
    columns:
      - name: delivery_sk
        description: Physical offer-event delivery key receiving one disposition.
        tests:
          - not_null
          - unique
      - name: disposition
        description: Exhaustive accepted, duplicate, or quarantined classification.
        tests:
          - accepted_values:
              arguments:
                values: [accepted, duplicate, quarantined]
      - name: disposition_reason
        description: Nullable runtime reason explaining duplicate or quarantine handling.
        tests:
          - accepted_values:
              arguments:
                values:
                  - assessment_unavailable_at_feature_cutoff
                  - exact_replay
                  - identity_mismatch
                  - immutable_key_conflict
                  - orphaned_request
                  - schema_validation_error
                  - unsupported_schema_version
      - name: request_id
        description: Request identity carried by the physical delivery.
        tests:
          - not_null
      - name: source
        description: Stable source name for the common disposition interface.
        tests:
          - accepted_values:
              arguments:
                values: [raw_offer_events]
      - name: survivor_delivery_sk
        description: Accepted earliest-delivery pointer populated only for exact replay duplicates.
        tests:
          - relationships:
              arguments:
                to: ref('stg_offer_events')
                field: delivery_sk
