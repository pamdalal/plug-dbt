version: 2

models:
  - name: int_canonical_offer_events
    description: >
      Contains accepted offer-event replay survivors only. It preserves all raw
      pricing and seller-response evidence plus exact typed and normalized
      derivatives; it does not select the current offer version or reconstruct
      the seller lifecycle.
    columns:
      - name: assessment_id_used
        description: Accepted pricing event's referenced assessment attempt.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: assessment_version_used
        description: Raw referenced assessment version on accepted pricing events.
        tests:
          - accepted_values:
              arguments:
                values: ["1", "2"]
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: assessment_version_used_numeric
        description: Exact integer referenced assessment version on accepted pricing events.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: delivery_sk
        description: Accepted physical delivery selected as the offer-event survivor.
        tests:
          - not_null
          - unique
      - name: event_at
        description: Raw business timestamp of the accepted immutable offer event.
        tests:
          - not_null
      - name: event_at_ts
        description: Parsed business instant of the accepted offer event.
        tests:
          - not_null
      - name: event_sequence
        description: Raw logical event position retained for candidate reconstruction.
        tests:
          - not_null
      - name: event_sequence_numeric
        description: Exact positive integer event position.
        tests:
          - accepted_range:
              arguments:
                inclusive: false
                min_value: 0
      - name: event_type
        description: Accepted pricing or seller-response event classification.
        tests:
          - accepted_values:
              arguments:
                values: [issued, revised, accepted, declined, expired, withdrawn]
      - name: expires_at
        description: Raw contractual expiry on accepted pricing-bearing events.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: expires_at_ts
        description: Parsed contractual expiry instant on accepted pricing events.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: feature_cutoff_at
        description: Raw point-in-time feature cutoff on accepted pricing events.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: feature_cutoff_at_ts
        description: Parsed point-in-time feature cutoff on accepted pricing events.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: has_non_z_timestamp_representation
        description: True when accepted evidence uses an explicit offset instead of a trailing Z.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: ingested_at
        description: Raw arrival timestamp of the accepted offer delivery.
        tests:
          - not_null
      - name: ingested_at_ts
        description: Parsed arrival instant of the accepted offer delivery.
        tests:
          - not_null
      - name: net_policy_adjustment_amount
        description: Raw signed policy adjustment on accepted pricing events.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: net_policy_adjustment_amount_numeric
        description: Exact numeric raw policy adjustment before unit normalization.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: net_policy_adjustment_usd
        description: Exact signed policy adjustment normalized to USD.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: net_policy_adjustment_usd_cents
        description: Exact signed policy adjustment normalized to integer USD cents.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: offer_id
        description: Logical offer identifier shared across accepted events.
        tests:
          - not_null
      - name: offer_version
        description: Raw supported offer version referenced by the accepted event.
        tests:
          - accepted_values:
              arguments:
                values: ["1", "2"]
      - name: offer_version_numeric
        description: Exact supported integer offer version.
        tests:
          - accepted_range:
              arguments:
                inclusive: true
                min_value: 1
                max_value: 2
      - name: predicted_wholesale_value_amount
        description: Raw positive wholesale prediction on accepted pricing events.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: predicted_wholesale_value_amount_numeric
        description: Exact numeric wholesale prediction before unit normalization.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: predicted_wholesale_value_usd
        description: Exact accepted wholesale prediction normalized to USD.
        tests:
          - accepted_range:
              arguments:
                inclusive: false
                min_value: 0
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: predicted_wholesale_value_usd_cents
        description: Exact accepted wholesale prediction normalized to integer USD cents.
        tests:
          - accepted_range:
              arguments:
                inclusive: false
                min_value: 0
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: pricing_amount_unit
        description: Raw amount unit governing the accepted complete pricing block.
        tests:
          - accepted_values:
              arguments:
                values: [usd, usd_cent]
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: pricing_amount_unit_normalized
        description: True when accepted pricing evidence was delivered in integer cents.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: pricing_currency_code
        description: Currency governing the accepted complete pricing block.
        tests:
          - accepted_values:
              arguments:
                values: [USD]
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: pricing_evaluated_at
        description: Raw model-evaluation timestamp on accepted pricing events.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: pricing_evaluated_at_ts
        description: Parsed model-evaluation instant on accepted pricing events.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: pricing_evaluation_id
        description: Immutable pricing evaluation identifier on accepted pricing events.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: pricing_model_version
        description: Fictional model version on accepted pricing events.
        tests:
          - accepted_values:
              arguments:
                values: [model_baseline, model_challenger]
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: pricing_policy_version
        description: Frozen policy version on accepted pricing events.
        tests:
          - accepted_values:
              arguments:
                values: [policy_v1]
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: reason_code
        description: Nullable accepted revision or seller-response reason.
        tests:
          - accepted_values:
              arguments:
                values:
                  - assessment_correction
                  - seller_declined
                  - seller_withdrew
                  - time_based_reprice
      - name: request_id
        description: Canonical request foreign key for the accepted offer event.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_canonical_valuation_requests')
                field: request_id
      - name: schema_version
        description: Supported lexical offer-event schema version.
        tests:
          - accepted_values:
              arguments:
                values: ["1.0"]
      - name: seller_offer_amount
        description: Raw positive seller offer on accepted pricing events.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
          - null_when:
              arguments:
                condition: "event_type not in ('issued', 'revised')"
      - name: seller_offer_amount_numeric
        description: Exact numeric seller offer before unit normalization.
        tests:
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: seller_offer_usd
        description: Exact accepted seller offer normalized to USD.
        tests:
          - accepted_range:
              arguments:
                inclusive: false
                min_value: 0
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: seller_offer_usd_cents
        description: Exact accepted seller offer normalized to integer USD cents.
        tests:
          - accepted_range:
              arguments:
                inclusive: false
                min_value: 0
          - required_when:
              arguments:
                condition: "event_type in ('issued', 'revised')"
      - name: source_batch_id
        description: Accepted delivery-batch lineage retained for auditability.
        tests:
          - not_null
      - name: source_event_id
        description: Claimed immutable event identifier on the accepted delivery.
        tests:
          - not_null
      - name: source_record_id
        description: Source identifier of the accepted physical offer delivery.
        tests:
          - not_null
      - name: source_system
        description: Fixed offer-service producer namespace.
        tests:
          - accepted_values:
              arguments:
                values: [offer_service]
      - name: source_updated_at
        description: Raw source-change timestamp of the accepted offer delivery.
        tests:
          - not_null
      - name: source_updated_at_ts
        description: Parsed source-change instant of the accepted offer delivery.
        tests:
          - not_null
      - name: synthetic_vin
        description: Synthetic vehicle key already reconciled to the canonical request.
        tests:
          - not_null
