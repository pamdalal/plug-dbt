version: 2

models:
  - name: stg_valuation_requests
    description: >
      Preserves one row per physical valuation-request delivery, including all
      raw text fields, at the delivery_sk grain. The model parses offset-aware
      timestamps, derives exact odometer values in both supported units, and
      flags non-Z timestamp representations without changing disposition.
      Incremental runs append only rows whose parsed ingested_at instant is
      strictly greater than the target maximum; a null target maximum loads all
      rows. Equal-watermark and earlier deliveries remain visible through the
      bidirectional seed-to-staging completeness tests.
    columns:
      - name: delivery_sk
        description: Deterministic physical-delivery key namespaced to raw valuation requests.
        tests:
          - not_null
          - unique
      - name: has_non_z_timestamp_representation
        description: True when any delivered timestamp uses an explicit offset instead of a trailing Z.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: ingested_at
        description: Raw offset-aware warehouse-arrival timestamp used as the incremental watermark.
        tests:
          - not_null
      - name: ingested_at_ts
        description: Parsed TIMESTAMP_TZ instant for the raw ingestion timestamp.
        tests:
          - not_null
      - name: market_region
        description: Frozen synthetic market region associated with the seller request.
        tests:
          - accepted_values:
              arguments:
                values: [great_lakes, mid_atlantic, mountain_west, pacific_coast]
      - name: odometer_kilometers
        description: Exact odometer observation normalized to kilometers using 1 mi = 1.609344 km.
        tests:
          - accepted_range:
              arguments:
                inclusive: false
                min_value: 0
      - name: odometer_miles
        description: Exact odometer observation normalized to miles using 1 mi = 1.609344 km.
        tests:
          - accepted_range:
              arguments:
                inclusive: false
                min_value: 0
      - name: odometer_unit
        description: Raw unit governing the delivered odometer value.
        tests:
          - accepted_values:
              arguments:
                values: [mi, km]
      - name: odometer_unit_normalized
        description: True when kilometer input required conversion to produce the miles derivative.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: odometer_value
        description: Raw positive-integer odometer text preserved exactly from the seed.
        tests:
          - not_null
      - name: odometer_value_numeric
        description: Exact numeric interpretation of the raw odometer text in odometer_unit.
        tests:
          - accepted_range:
              arguments:
                inclusive: false
                min_value: 0
      - name: request_id
        description: Immutable valuation-request identifier and future lifecycle fact grain.
        tests:
          - not_null
      - name: schema_version
        description: Lexical source payload version retained as text.
        tests:
          - accepted_values:
              arguments:
                values: ["1.0"]
      - name: seller_id
        description: Synthetic individual-seller identifier associated with the request.
        tests:
          - not_null
      - name: source_batch_id
        description: Physical delivery-batch lineage identifier with no business-key semantics.
        tests:
          - not_null
      - name: source_record_id
        description: Source-system identifier for one immutable physical delivery.
        tests:
          - not_null
      - name: source_system
        description: Fixed producer namespace for valuation-request deliveries.
        tests:
          - accepted_values:
              arguments:
                values: [valuation_portal]
      - name: source_updated_at
        description: Raw offset-aware source-change timestamp retained for replay comparison.
        tests:
          - not_null
      - name: source_updated_at_ts
        description: Parsed TIMESTAMP_TZ instant for the source-change timestamp.
        tests:
          - not_null
      - name: submission_channel
        description: Frozen channel through which the individual owner submitted the request.
        tests:
          - accepted_values:
              arguments:
                values: [web, mobile]
      - name: submitted_at
        description: Raw offset-aware business timestamp when the seller submitted the request.
        tests:
          - not_null
      - name: submitted_at_ts
        description: Parsed TIMESTAMP_TZ instant for request submission.
        tests:
          - not_null
      - name: synthetic_vin
        description: Authoritative visibly synthetic cross-source vehicle trace key for this fixture.
        tests:
          - not_null
