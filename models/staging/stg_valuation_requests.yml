version: 2

models:
  - name: stg_valuation_requests
    description: >
      Preserves one row per physical raw_valuation_requests delivery at the
      source_record_id grain without merging, deduplicating, or selecting a
      canonical request. Incremental runs append only source rows whose
      ingested_at is strictly greater than the maximum ingested_at already in
      the target, so equal-watermark and backdated deliveries are surfaced by
      the reverse completeness test. valuation_request_sk hashes the constant
      entity namespace valuation_request with source_system and
      source_record_id, preventing identical source identifiers in other fact
      types from sharing a key. All hash inputs and loaded source columns are
      retained for traceability. submitter_account_id remains null when the
      source delivery does not identify an account, and synthetic contact
      fields remain source evidence rather than governed customer attributes.
    columns:
      - name: channel
        description: Source channel through which the valuation request was submitted.
        tests:
          - not_null
      - name: contact_email
        description: Synthetic source email retained as delivery evidence; non-null values must contain non-whitespace text.
        tests:
          - not_empty_string
      - name: contact_name
        description: Synthetic source contact name retained as delivery evidence; non-null values must contain non-whitespace text.
        tests:
          - not_empty_string
      - name: contact_phone
        description: Synthetic source phone value retained as delivery evidence; non-null values must contain non-whitespace text.
        tests:
          - not_empty_string
      - name: ingested_at
        description: Required source loading timestamp and strict append-only incremental watermark.
        tests:
          - not_null
      - name: odometer_unit
        description: Required raw unit used to interpret the delivered odometer observation.
        tests:
          - not_null
      - name: odometer_value
        description: Raw non-negative odometer observation preserved in odometer_unit without canonical-unit conversion.
        tests:
          - accepted_range:
              arguments:
                inclusive: true
                min_value: 0
      - name: postal_code
        description: Source postal-code value at the Snowflake seed type boundary; lexical formatting lost during seed inference is not reconstructed.
        tests:
          - accepted_range:
              arguments:
                inclusive: true
                min_value: 0
      - name: request_id
        description: Source valuation-request identifier that may repeat across distinct physical deliveries.
        tests:
          - not_null
      - name: schema_version
        description: Positive source payload schema version associated with the physical delivery.
        tests:
          - accepted_range:
              arguments:
                inclusive: true
                min_value: 1
      - name: source_batch_id
        description: Required source delivery batch identifier retained for provenance and replay analysis.
        tests:
          - not_null
      - name: source_record_id
        description: Durable identifier for one physical source-delivery row; it defines the model grain but is never used to merge or deduplicate.
        tests:
          - not_null
          - unique
      - name: source_system
        description: Required identifier for the system that produced the delivered valuation request.
        tests:
          - not_null
      - name: source_updated_at
        description: Required source-system timestamp for the latest update represented by the payload.
        tests:
          - not_null
      - name: submitted_at
        description: Source-provided timestamp when the valuation request was submitted.
        tests:
          - not_null
      - name: submitter_account_id
        description: Nullable source account identifier; anonymous consumer submissions intentionally retain null.
        tests:
          - not_empty_string
      - name: submitter_type
        description: Required source classification of the party submitting the valuation request.
        tests:
          - not_null
      - name: valuation_request_sk
        description: Namespaced surrogate key for one physical valuation-request delivery, generated by hashing the valuation_request entity namespace, source_system, and source_record_id.
        tests:
          - not_null
          - unique
      - name: vin_like
        description: Required source vehicle-identifier observation retained without trimming, case normalization, or domain-validity claims.
        tests:
          - not_empty_string
