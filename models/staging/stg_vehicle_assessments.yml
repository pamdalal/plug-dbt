version: 2

models:
  - name: stg_vehicle_assessments
    description: >
      Preserves one row per physical vehicle-assessment delivery, including the
      intentionally unsupported 0.9 envelope, at the delivery_sk grain. Raw
      evidence remains unchanged while offset-aware timestamp, exact numeric,
      battery percentage, and odometer-unit derivatives are added. Usable
      assessment features remain null for failed and unsupported rows.
      Incremental runs append only parsed ingested_at instants strictly greater
      than the target maximum and load all rows when that maximum is null.
    columns:
      - name: assessed_odometer_kilometers
        description: Nullable exact usable-assessment odometer normalized to kilometers.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: assessed_odometer_miles
        description: Nullable exact usable-assessment odometer normalized to miles.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: assessed_odometer_unit
        description: Raw unit for the assessed odometer, present only on supported usable rows.
        tests:
          - accepted_values:
              arguments:
                values: [mi, km]
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: assessed_odometer_unit_normalized
        description: True when kilometer input required conversion to produce the miles derivative.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: assessed_odometer_value
        description: Raw positive-integer assessment odometer text, nullable outside usable rows.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: assessed_odometer_value_numeric
        description: Exact numeric interpretation of assessed_odometer_value in its raw unit.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: assessment_completed_at
        description: Raw completion timestamp for supported failed or usable assessments.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0'"
      - name: assessment_completed_at_ts
        description: Parsed TIMESTAMP_TZ instant for assessment completion.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0'"
      - name: assessment_id
        description: Identifier for the source assessment attempt shared by supported versions.
        tests:
          - not_null
      - name: assessment_method_version
        description: Fictional assessment-method version, null only on unsupported schema evidence.
        tests:
          - accepted_values:
              arguments:
                values: [method_baseline, method_current]
          - required_when:
              arguments:
                condition: "schema_version = '1.0'"
      - name: assessment_status
        description: Supported assessment result distinguishing usable feature sets from failures.
        tests:
          - accepted_values:
              arguments:
                values: [usable, failed]
          - required_when:
              arguments:
                condition: "schema_version = '1.0'"
      - name: assessment_version
        description: Raw positive assessment-version text within one assessment attempt.
        tests:
          - accepted_values:
              arguments:
                values: ["1", "2"]
          - required_when:
              arguments:
                condition: "schema_version = '1.0'"
      - name: assessment_version_numeric
        description: Exact integer interpretation of assessment_version for supported rows.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0'"
      - name: available_to_model_at
        description: Raw timestamp when a supported result became visible to model serving.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0'"
      - name: available_to_model_at_ts
        description: Parsed TIMESTAMP_TZ instant for model-serving availability.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0'"
      - name: battery_soh_percent
        description: Exact battery state-of-health percentage for supported usable assessments.
        tests:
          - accepted_range:
              arguments:
                inclusive: true
                min_value: 50.0
                max_value: 100.0
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: battery_soh_unit
        description: Raw percent unit accompanying battery state of health on usable rows.
        tests:
          - accepted_values:
              arguments:
                values: [percent]
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: battery_soh_value
        description: Raw one-decimal battery state-of-health text on supported usable rows.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: condition_grade
        description: Frozen synthetic condition classification on supported usable rows.
        tests:
          - accepted_values:
              arguments:
                values: [clean, average, rough]
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: delivery_sk
        description: Deterministic physical-delivery key namespaced to raw vehicle assessments.
        tests:
          - not_null
          - unique
      - name: has_non_z_timestamp_representation
        description: True when any delivered timestamp uses an explicit offset instead of a trailing Z.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: ingested_at
        description: Raw offset-aware warehouse-arrival timestamp used as the incremental watermark.
        tests:
          - not_null
      - name: ingested_at_ts
        description: Parsed TIMESTAMP_TZ instant for the raw ingestion timestamp.
        tests:
          - not_null
      - name: model_year
        description: Raw four-digit model-year text on supported usable assessments.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: model_year_numeric
        description: Exact integer model year constrained to the frozen 2012 through 2026 range.
        tests:
          - accepted_range:
              arguments:
                inclusive: true
                min_value: 2012
                max_value: 2026
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
      - name: observed_at
        description: Raw timestamp when usable vehicle observations were made.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: observed_at_ts
        description: Parsed TIMESTAMP_TZ instant for usable vehicle observation.
        tests:
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: request_id
        description: Valuation-request foreign key carried by every physical assessment delivery.
        tests:
          - not_null
      - name: schema_version
        description: Lexical source schema version, including retained unsupported 0.9 evidence.
        tests:
          - accepted_values:
              arguments:
                values: ["0.9", "1.0"]
      - name: source_batch_id
        description: Physical delivery-batch lineage identifier with no business-key semantics.
        tests:
          - not_null
      - name: source_record_id
        description: Source-system identifier for one immutable physical delivery.
        tests:
          - not_null
      - name: source_system
        description: Fixed producer namespace for vehicle-assessment deliveries.
        tests:
          - accepted_values:
              arguments:
                values: [vehicle_assessment]
      - name: source_updated_at
        description: Raw offset-aware source-change timestamp retained for replay comparison.
        tests:
          - not_null
      - name: source_updated_at_ts
        description: Parsed TIMESTAMP_TZ instant for the source-change timestamp.
        tests:
          - not_null
      - name: synthetic_vin
        description: Delivered synthetic vehicle trace key checked against the canonical request downstream.
        tests:
          - not_null
      - name: vehicle_model_family
        description: Frozen fictional vehicle taxonomy value on supported usable assessments.
        tests:
          - accepted_values:
              arguments:
                values:
                  - chevrolet_bolt_ev
                  - ford_f150_lightning
                  - ford_mustang_mach_e
                  - hyundai_ioniq_5
                  - nissan_leaf
                  - tesla_model_3
                  - tesla_model_y
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
      - name: vehicle_segment
        description: Frozen segment mapped one-to-one from vehicle_model_family on usable rows.
        tests:
          - accepted_values:
              arguments:
                values: [hatchback, sedan, crossover, pickup]
          - required_when:
              arguments:
                condition: "schema_version = '1.0' and assessment_status = 'usable'"
          - null_when:
              arguments:
                condition: "schema_version <> '1.0' or assessment_status = 'failed'"
