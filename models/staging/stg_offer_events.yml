version: 2

models:
  - name: stg_offer_events
    description: >
      Preserves one row per physical raw_offer_events delivery at the
      source_record_id grain without merging, deduplicating, or selecting a
      canonical event. Incremental runs append only source rows whose
      ingested_at is strictly greater than the maximum ingested_at already in
      the target, so equal-watermark and backdated deliveries are surfaced by
      the reverse completeness test. offer_event_sk hashes the constant entity
      namespace offer_event with source_system and source_record_id, preventing
      identical source identifiers in other fact types from sharing a key. All
      hash inputs and loaded source columns are retained for traceability.
      offer_amount_dollars adds number(38,2) normalization: dollar values are
      preserved, cent values are divided by 100, null amounts remain null, and
      unsupported units produce null without currency conversion.
    columns:
      - name: currency_code
        description: Currency for the raw amount; unit normalization does not convert between currencies.
        tests:
          - not_null
      - name: event_at
        description: Source-provided timestamp when the claimed offer lifecycle event occurred.
        tests:
          - not_null
      - name: event_sequence
        description: Source-provided event position within an offer lifecycle; values can repeat across offers and deliveries.
        tests:
          - not_null
      - name: event_type
        description: Source lifecycle classification for the delivered event.
        tests:
          - not_null
      - name: expires_at
        description: Source-provided timestamp when the offer represented by the event expires.
        tests:
          - not_null
      - name: ingested_at
        description: Required source loading timestamp and strict append-only incremental watermark.
        tests:
          - not_null
      - name: offer_amount
        description: Raw fixed-point amount in offer_amount_unit; null is preserved when the source delivery omits an amount.
        tests:
          - accepted_range:
              arguments:
                inclusive: true
                min_value: 0
      - name: offer_amount_dollars
        description: Nullable number(38,2) amount normalized to dollars without currency conversion; supported non-null source amounts cannot produce a negative value.
        tests:
          - accepted_range:
              arguments:
                inclusive: true
                min_value: 0
      - name: offer_amount_unit
        description: Raw unit required to interpret offer_amount and derive offer_amount_dollars.
        tests:
          - not_null
      - name: offer_event_sk
        description: Namespaced surrogate key for one physical offer-event delivery, generated by hashing the offer_event entity namespace, source_system, and source_record_id.
        tests:
          - not_null
          - unique
      - name: offer_id
        description: Source offer identifier shared by valid lifecycle events and repeated physical deliveries.
        tests:
          - not_null
      - name: offer_version
        description: Source-provided revision number for the offer state represented by the event.
        tests:
          - not_null
      - name: reason_code
        description: Nullable source explanation for lifecycle events; when present, the value must contain non-whitespace text.
        tests:
          - not_empty_string
      - name: request_id
        description: Source request identifier linking the event to its valuation request; repeated values are expected.
        tests:
          - not_null
      - name: schema_version
        description: Source payload schema version associated with the physical delivery.
        tests:
          - not_null
      - name: source_batch_id
        description: Required source delivery batch identifier retained for provenance and replay analysis.
        tests:
          - not_null
      - name: source_event_id
        description: Claimed immutable source event identifier that may repeat across distinct physical deliveries.
        tests:
          - not_null
      - name: source_record_id
        description: Durable identifier for one physical source-delivery row; it defines the model grain but is never used to merge or deduplicate.
        tests:
          - not_null
          - unique
      - name: source_system
        description: Required identifier for the system that produced the delivered offer event.
        tests:
          - not_null
      - name: source_updated_at
        description: Required source-system timestamp for the latest update represented by the payload.
        tests:
          - not_null
